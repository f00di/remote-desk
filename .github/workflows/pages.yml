name: Deploy site to GitHub Pages

# Publishes only site/ (static HTML/CSS/JS, no build step) to
# https://f00di.github.io/remote-desk/. One-time setting:
# Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site/
        uses: actions/upload-pages-artifact@v4
        with:
          # Only the site: never the Go code, docs or anything else.
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
