<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#181818">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/admin.css">
  <title>Remote Desk</title>
  <script src="/theme.js"></script>
  <script src="/icons.js" defer></script>
  <script src="/admin.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="titlebar">
      <div class="tb-left">
        <span class="tb-brand" id="tb-brand">Remote Desk</span>
      </div>
      <button class="cmd-box" type="button" id="cmd-box" aria-label="Run a command">
        <span id="cmd-icon"></span><span class="cmd-text">Run a command</span><span class="kbd" id="cmd-kbd">⌘K</span>
      </button>
      <div class="tb-right" id="tb-right">this laptop only</div>
    </header>
    <div class="body">
      <nav class="activity" id="activity" aria-label="Sections"></nav>
      <aside class="sidebar" id="sidebar" aria-label="Section overview"></aside>
      <main class="main" id="main">
        <div class="tabs"><div class="tab" id="tab"></div></div>
        <div class="crumbs" id="crumbs"></div>
        <div class="editor" id="editor" tabindex="-1"></div>
        <section class="panel" id="panel" aria-label="Activity">
          <div class="panel-head">
            <span class="panel-tab">Activity</span>
            <span class="fill"></span>
            <span class="live"><span class="dot ok pulse"></span>live · names and paths only</span>
            <button class="icon-btn" type="button" id="panel-open" title="Open activity" aria-label="Open activity"></button>
          </div>
          <div class="log tail" id="panel-log"></div>
        </section>
      </main>
    </div>
    <footer class="status" id="status"></footer>
  </div>
</body>
</html>
